name: Report a crash
description: Vela is crashing or freezing or hanging.
type: Crash
labels: "state:needs triage"
body:
  - type: textarea
    attributes:
      label: Reproduction steps
      description: A step-by-step description of how to reproduce the crash from a **clean Vela install**. The more context you provide, the easier it is to find and fix the problem fast.
      placeholder: |
        1. Start Vela
        2. Perform an action
        3. Vela crashes
    validations:
      required: true
  - type: textarea
    attributes:
      label: Vela version and system specs
      description: |
        Open the command palette in Vela, then type “vela: copy system specs into clipboard”.
      placeholder: |
        Vela: v0.215.0 (Vela Nightly bfe141ea79aa4984028934067ba75c48d99136ae)
        OS: macOS 15.1
        Memory: 36 GiB
        Architecture: aarch64
    validations:
      required: true
  - type: textarea
    attributes:
      label: Attach Vela log file
      description: |
        Open the command palette in Vela, then type `vela: open log` to see the last 1000 lines. Or type `vela: reveal log in file manager` in the command palette to reveal the log file itself.

        ⚠️ **Please review your log file for secrets (API keys, tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>Vela.log</summary>

        <!-- Paste your log inside the code block. -->
        ```log

        ```

        </details>
    validations:
      required: false
