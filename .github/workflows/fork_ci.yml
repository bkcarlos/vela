# Fork CI: checks and tests on GitHub-hosted runners.
#
# The upstream run_tests.yml is gated on repository_owner == 'vela-industries'
# and uses private namespace runners, so it can never run on a personal fork.
# This workflow mirrors its checks on free runners, minus Windows (too slow on
# hosted runners) and jobs requiring private secrets (sccache, protobuf buf).
name: fork_ci

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

on:
  push:
    branches:
      - vela/main
  pull_request:
    branches:
      - '**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_style:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Prettier
        # docs/ markdown has pre-existing format drift from upstream; only
        # enforce prettier on the JSON settings asset until that is cleaned up.
        run: pnpm dlx prettier@3.5.0 assets/settings/default.json --parser=jsonc --check
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: check-todos
        run: ./script/check-todos
      - name: check-keymaps
        run: ./script/check-keymaps
      - name: typos
        uses: crate-ci/typos@v1
        with:
          config: ./typos.toml

  check_licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: licenses
      - name: check-licenses
        run: ./script/check-licenses
      - name: generate-licenses
        run: ./script/generate-licenses

  check_docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Link check
        # Building the book requires compiling the full vela binary for action
        # metadata, which is not worth 30+ min on a fork; check links only.
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude '^http' './docs/src/**/*'
          fail: true

  clippy:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-${{ matrix.os }}
          cache-on-failure: true
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libssl-dev libzstd-dev \
            libvulkan1 libgit2-dev cmake mold clang
      - name: Download WASI SDK
        run: ./script/download-wasi-sdk
      - name: Clippy workspace
        run: ./script/clippy --workspace --all-targets --all-features

  run_tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-${{ matrix.os }}
          cache-on-failure: true
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libssl-dev libzstd-dev \
            libvulkan1 libgit2-dev cmake mold clang
      - name: Download WASI SDK
        run: ./script/download-wasi-sdk
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run workspace tests
        run: cargo nextest run --workspace --no-fail-fast --no-tests=warn

  doctests:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: doctests
          cache-on-failure: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libssl-dev libzstd-dev \
            libvulkan1 libgit2-dev cmake mold clang
      - name: Download WASI SDK
        run: ./script/download-wasi-sdk
      - name: Run doctests
        run: cargo test --workspace --doc --no-fail-fast

  check_workspace_binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: binaries
          cache-on-failure: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libssl-dev libzstd-dev \
            libvulkan1 libgit2-dev cmake mold clang
      - name: Download WASI SDK
        run: ./script/download-wasi-sdk
      - name: Build workspace binaries and examples
        run: cargo build --workspace --bins --examples

  check_wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          cache-on-failure: true
      - name: Check wasm targets
        run: cargo -Zbuild-std=std,panic_abort check --target wasm32-unknown-unknown -p gpui_platform -p cloud_api_client
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: -C target-feature=+atomics,+bulk-memory,+mutable-globals
          RUSTC_BOOTSTRAP: '1'
