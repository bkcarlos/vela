# Fork release builds:
#   - macOS universal (arm64 + x86_64, lipo-merged): Developer ID signed and
#     notarized release app in both ZIP and DMG formats
#   - Linux x86_64: release .tar.gz
#
# Triggers on version tags (e.g. v1.15.2) or manual dispatch, and uploads both
# workflow artifacts and (for tags) a GitHub Release.
name: fork_release

env:
  CARGO_TERM_COLOR: always

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_macos:
    # macos-15 for Xcode 16: webrtc-sys bridge C++ fails to compile with the
    # libc++ shipped in Xcode 15.4 (macos-14).
    runs-on: macos-15
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch_suffix: aarch64
          # Cross-compile intel mac from the arm runner. Rust + Apple's
          # universal SDK make this transparent for pure Rust deps, and the
          # two slices are lipo-merged into a universal binary below.
          - target: x86_64-apple-darwin
            arch_suffix: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-${{ matrix.arch_suffix }}
          cache-on-failure: true
      - name: Build Vela.app bundle
        run: ./script/bundle-mac -a ${{ matrix.target }}
      - name: Collect app bundle for universal merge
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "target/${{ matrix.target }}/release/bundle/osx/Vela.app" \
            "dist/Vela-${{ matrix.arch_suffix }}.app.zip"
          cp "target/vela-remote-server-macos-${{ matrix.arch_suffix }}.gz" dist/
      - name: Upload per-arch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vela-macos-${{ matrix.arch_suffix }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  build_macos_universal:
    name: Lipo and archive universal app
    needs: build_macos
    runs-on: macos-15
    timeout-minutes: 120
    env:
      TAG: ${{ github.ref_name }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Import Developer ID certificate
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE:?missing MACOS_CERTIFICATE secret}"
          : "${MACOS_CERTIFICATE_PASSWORD:?missing MACOS_CERTIFICATE_PASSWORD secret}"
          : "${MACOS_SIGNING_IDENTITY:?missing MACOS_SIGNING_IDENTITY secret}"
          : "${APPLE_NOTARIZATION_KEY:?missing APPLE_NOTARIZATION_KEY secret}"
          : "${APPLE_NOTARIZATION_KEY_ID:?missing APPLE_NOTARIZATION_KEY_ID secret}"
          : "${APPLE_NOTARIZATION_ISSUER_ID:?missing APPLE_NOTARIZATION_ISSUER_ID secret}"

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          DEVELOPER_ID_CA_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          KEYCHAIN_PATH="$RUNNER_TEMP/vela-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          printf '%s' "$MACOS_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          curl --fail --silent --show-error --location \
            'https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer' \
            --output "$DEVELOPER_ID_CA_PATH"
          security import "$DEVELOPER_ID_CA_PATH" \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          NOTARIZATION_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARIZATION_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARIZATION_KEY" > "$NOTARIZATION_KEY_PATH"
          chmod 600 "$NOTARIZATION_KEY_PATH"
          echo "NOTARIZATION_KEY_PATH=$NOTARIZATION_KEY_PATH" >> "$GITHUB_ENV"

      - name: Merge app binaries with lipo
        run: |
          set -euo pipefail
          ditto -x -k artifacts/vela-macos-aarch64/Vela-aarch64.app.zip arm
          ditto -x -k artifacts/vela-macos-x86_64/Vela-x86_64.app.zip intel

          ARM_APP="arm/Vela.app"
          INTEL_APP="intel/Vela.app"
          UNIVERSAL_APP="Vela.app"

          # Start from the arm64 bundle and replace every Mach-O file with a
          # universal (fat) binary merged from both slices.
          ditto "$ARM_APP" "$UNIVERSAL_APP"

          merge_binaries() {
            local rel_path="$1"
            local arm_bin="$ARM_APP/$rel_path"
            local intel_bin="$INTEL_APP/$rel_path"
            local out_bin="$UNIVERSAL_APP/$rel_path"
            if [[ -f "$arm_bin" && -f "$intel_bin" ]]; then
              lipo -create -output "$out_bin" "$arm_bin" "$intel_bin"
              echo "merged: $rel_path"
            fi
          }

          merge_binaries "Contents/MacOS/vela"
          merge_binaries "Contents/MacOS/cli"

          file "$UNIVERSAL_APP/Contents/MacOS/vela"

      - name: Merge remote_server with lipo
        run: |
          set -euo pipefail
          mkdir -p remote_server_parts
          gunzip -c artifacts/vela-macos-aarch64/vela-remote-server-macos-aarch64.gz > remote_server_parts/remote_server-arm
          gunzip -c artifacts/vela-macos-x86_64/vela-remote-server-macos-x86_64.gz > remote_server_parts/remote_server-intel
          lipo -create -output remote_server_parts/remote_server-universal \
            remote_server_parts/remote_server-arm remote_server_parts/remote_server-intel
          file remote_server_parts/remote_server-universal

      - name: Sign and notarize universal app
        run: |
          set -euo pipefail
          APP="Vela.app"
          ENTITLEMENTS="crates/vela/resources/vela.entitlements"
          rm -f "$APP/Contents/embedded.provisionprofile"

          codesign --force --timestamp --options runtime \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$APP/Contents/MacOS/cli"
          codesign --force --timestamp --options runtime \
            --entitlements "$ENTITLEMENTS" \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$APP/Contents/MacOS/vela"
          codesign --force --timestamp --options runtime \
            --entitlements "$ENTITLEMENTS" \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$APP"
          codesign --force --timestamp --options runtime \
            --sign "$MACOS_SIGNING_IDENTITY" \
            remote_server_parts/remote_server-universal

          codesign --verify --deep --strict --verbose=2 "$APP"
          NOTARIZATION_ARCHIVE="$RUNNER_TEMP/Vela-notarization.zip"
          ditto -c -k --keepParent "$APP" "$NOTARIZATION_ARCHIVE"
          xcrun notarytool submit "$NOTARIZATION_ARCHIVE" \
            --key "$NOTARIZATION_KEY_PATH" \
            --key-id "$APPLE_NOTARIZATION_KEY_ID" \
            --issuer "$APPLE_NOTARIZATION_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Make versioned app archive and checksums
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          APP_ARCHIVE="Vela-${VERSION}-macos-universal.zip"

          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent Vela.app "dist/$APP_ARCHIVE"
          shasum -a 256 "dist/$APP_ARCHIVE" | awk '{print $1}' > "dist/$APP_ARCHIVE.sha256"
          gzip -f --stdout --best remote_server_parts/remote_server-universal > "dist/vela-remote-server-macos-universal.gz"
          shasum -a 256 "dist/vela-remote-server-macos-universal.gz" | awk '{print $1}' > "dist/vela-remote-server-macos-universal.gz.sha256"
          ls -lh dist/

      - name: Make and notarize versioned DMG
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DMG_NAME="Vela-${VERSION}-macos-universal.dmg"

          # The auto-updater installs macOS updates from a DMG (hdiutil attach),
          # so the release must provide one alongside the ZIP.
          DMG_DIR="$(mktemp -d)/dmg"
          mkdir -p "$DMG_DIR"
          ditto Vela.app "$DMG_DIR/Vela.app"
          ln -s /Applications "$DMG_DIR/Applications"
          hdiutil create -volname Vela -srcfolder "$DMG_DIR" -ov -format UDZO "dist/$DMG_NAME"
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "dist/$DMG_NAME"
          xcrun notarytool submit "dist/$DMG_NAME" \
            --key "$NOTARIZATION_KEY_PATH" \
            --key-id "$APPLE_NOTARIZATION_KEY_ID" \
            --issuer "$APPLE_NOTARIZATION_ISSUER_ID" \
            --wait
          xcrun stapler staple "dist/$DMG_NAME"
          xcrun stapler validate "dist/$DMG_NAME"
          spctl --assess --type open --context context:primary-signature --verbose=2 "dist/$DMG_NAME"
          shasum -a 256 "dist/$DMG_NAME" | awk '{print $1}' > "dist/$DMG_NAME.sha256"
          ls -lh dist/

      - name: Upload universal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vela-macos-universal
          path: dist/
          if-no-files-found: error
          retention-days: 14

  build_linux:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux
          cache-on-failure: true
      - name: Install system dependencies
        run: ./script/linux
      - name: Download WASI SDK
        run: ./script/download-wasi-sdk
      - name: Build Linux release tarball
        run: ./script/bundle-linux
      - name: Add checksum
        run: |
          cd target/release
          sha256sum vela-linux-x86_64.tar.gz | awk '{print $1}' > vela-linux-x86_64.tar.gz.sha256
          cd ../..
          sha256sum target/vela-remote-server-linux-x86_64.gz | awk '{print $1}' > target/vela-remote-server-linux-x86_64.gz.sha256
      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: vela-linux-x86_64-tar-gz
          path: |
            target/release/vela-linux-x86_64.tar.gz
            target/release/vela-linux-x86_64.tar.gz.sha256
            target/vela-remote-server-linux-x86_64.gz
            target/vela-remote-server-linux-x86_64.gz.sha256
          if-no-files-found: error
          retention-days: 14

  publish_release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build_macos_universal, build_linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Vela ${{ github.ref_name }}
          draft: false
          files: |
            artifacts/vela-macos-universal/Vela-*-macos-universal.zip
            artifacts/vela-macos-universal/Vela-*-macos-universal.zip.sha256
            artifacts/vela-macos-universal/Vela-*-macos-universal.dmg
            artifacts/vela-macos-universal/Vela-*-macos-universal.dmg.sha256
            artifacts/vela-macos-universal/vela-remote-server-macos-universal.gz
            artifacts/vela-macos-universal/vela-remote-server-macos-universal.gz.sha256
            artifacts/vela-linux-x86_64-tar-gz/vela-linux-x86_64.tar.gz
            artifacts/vela-linux-x86_64-tar-gz/vela-linux-x86_64.tar.gz.sha256
            artifacts/vela-linux-x86_64-tar-gz/vela-remote-server-linux-x86_64.gz
            artifacts/vela-linux-x86_64-tar-gz/vela-remote-server-linux-x86_64.gz.sha256
          body: |
            Personal fork build.

            - macOS (universal: Apple Silicon + Intel): Developer ID signed and
              notarized. Install from the DMG or extract the ZIP and move
              `Vela.app` to `/Applications`.
            - Linux: extract and run `bin/vela`.
